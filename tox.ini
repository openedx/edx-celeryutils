[tox]
envlist = django{42,52},quality,docs
requires =
    tox-uv>=1

[doc8]
ignore = D001

[pycodestyle]
exclude = .git,.tox,migrations
max-line-length = 120

[pydocstyle]
ignore = D101,D105,D200,D203,D212
match-dir = (?!migrations)

[pytest]
DJANGO_SETTINGS_MODULE = test_settings
addopts = --cov celery_utils --cov-report term-missing --cov-report xml
norecursedirs = .* docs requirements

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
commands = 
    py.test tests/ src/celery_utils/ {posargs}

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups =
    doc
setenv = 
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = {toxinidir}
allowlist_externals = 
    make
    rm
commands = 
    doc8 --ignore-path docs/_build README.rst docs
    rm -f docs/celery_utils.rst
    rm -f docs/modules.rst
    make -C docs clean
    make -C docs html
    python -m build --wheel
    twine check dist/*

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups =
    quality
setenv = 
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = {toxinidir}
allowlist_externals = 
    make
    rm
    touch
commands = 
    touch tests/__init__.py
    pylint src/celery_utils tests test_utils
    rm tests/__init__.py
    pycodestyle src/celery_utils tests
    pydocstyle src/celery_utils tests
    isort --check-only tests test_utils src/celery_utils manage.py test_settings.py
    make help

