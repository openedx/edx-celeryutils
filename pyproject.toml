[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "edx-celeryutils"
description = "Code to support working with celery"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "AUTHORS"]
authors = [
    {name = "Open edX Project", email = "oscm@openedx.org"},
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Framework :: Django',
    'Framework :: Django :: 4.2',
    'Framework :: Django :: 5.2',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
]
keywords = [
    "Django",
    "edx",
]

dynamic = ["readme", "version"]

dependencies = [
    "celery<6.0",
    "Django",
    "django-model-utils",
    "jsonfield",
]

[project.urls]
Homepage = "https://github.com/openedx/edx-celeryutils"
Repository = "https://github.com/openedx/edx-celeryutils"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGELOG.rst"], content-type = "text/x-rst"}

[tool.setuptools.packages.find]
include = ["celery_utils", "celery_utils.*"]
exclude = ["*tests*"]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.isort]
line_length = 120
known_third_party = ["ddt", "mock"]
known_django = ["django"]
known_djangoapp = ["jsonfield", "model_utils", "celery"]
known_edx = []
known_first_party = ["celery_utils"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "DJANGOAPP", "EDX", "FIRSTPARTY", "LOCALFOLDER"]
force_sort_within_sections = true

[tool.coverage.run]
branch = true
data_file = ".coverage"
source = ["celeryutils"]
omit = [
    "test_settings",
    "*migrations*",
    "*admin.py",
    "*static*",
    "*templates*",
]
